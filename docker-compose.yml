services:
  redis:
    image: redis:8.4.0-alpine
    hostname: redis
    container_name: redis
    restart: always
    env_file:
      - ./backend/.env
    #ports:
    #  - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - redis_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 1s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
      
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbit
    hostname: rabbit
    ports:
    #  - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitmq_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 10
    
    volumes:
      - shared_data:/shared

  api:
    build: ./backend
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rabbitmq_network
      - redis_network
      - backend_network
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/shared
    
  ml_service:
    build: ./ml
    container_name: ml_service
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      lightonai:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LIGHTONAI_HOST=http://lightonai
      - LIGHTONAI_PORT=8001
    networks:
      - rabbitmq_network
      - redis_network
      - ml_network
    volumes:
      - shared_data:/shared

  lightonai:
    build: ./lightonai
    container_name: lightonai
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ml_network

  # ollama:
  #   build: ./ollama
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  #   environment:
  #     - OLLAMA_NUM_GPU=0
  #     - OLLAMA_GPU_LAYERS=4

  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - ml_network

  ollama:
      build: ./ollama
      container_name: ollama_host
      ports:
        - "11434:11434"
      volumes:
        - ollama_data:/root/.ollama

      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: all
                capabilities: [gpu]

      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
        interval: 30s
        timeout: 5s
        retries: 3
      networks:
        - ml_network


  bot:
    build: ./bot
    container_name: bot
    env_file:
      - ./bot/.env
    depends_on:
      - api
    networks:
     - backend_network
     
volumes:
  shared_data:
  redis_data:
  ollama_data:

networks:
  ml_network:
  rabbitmq_network:
  redis_network:
  backend_network: