stages:
    - lint
    - test
    - smoke

variables:
    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
    PYTHONUNBUFFERED: "1"
    PYTHON_VERSION: "3.11.9"

.python_alpine: &python_alpine
    image: python:${PYTHON_VERSION}-alpine

cache:
    paths:
        - ${PIP_CACHE_DIR}
        - ${CI_PROJECT_DIR}/backend/.venv/

default:
    <<: *python_alpine
    before_script:
        - echo "Preparing Python dependencies"
        - cd backend
        - python -m venv .venv
        - source .venv/bin/activate
        - pip install --upgrade pip
        - pip install --cache-dir ../.cache/pip ruff pytest
        - echo "Python deps ready"
        - |
            check_noempty() {
                local dir="$1"
                echo "Checking for empty directories $dir"
                if find "$dir" -type f ! -name ".gitkeep" ! -path "*/.*" | grep -q .; then
                    echo "$dir has real files"
                    return 0
                else
                    echo "$dir is empty (only .gitkeep)"
                    return 1
                fi
            }

python_lint:
    stage: lint
    script:
        - check_noempty backend
        - ruff check .

backend_unit_tests:
    stage: test
    needs:
        - python_lint
    script:
        - echo "Running backend unit tests..."
        - pytest -v

smoke_tests:
    stage: smoke
    needs:
        - backend_unit_tests
    script:
        - echo "No smoke tests yet"