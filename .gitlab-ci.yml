stages:
  - lint
  - test
  - smoke

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

cache:
  paths:
    - .cache/pip
    - node_modules/

default:
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m pip install --upgrade pip
    - pip install pytest ruff 

lint_python:
  stage: lint
  script:
    - ruff check .
  allow_failure: false

lint_js:
  stage: lint
  image: node:22
  before_script:
    - cd bot
    - npm ci  || npm install
  script:
    - echo "Running ESLint..."
    - npx eslint . || echo "No ESLint config yet"
  allow_failure: false

unit_tests_backend:
  stage: test
  needs: 
    - lint_python
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest
    - echo "Running backend tests..."
    - pytest -v || echo "No smoke tests yet"

unit_tests_bot:
  stage: test
  image: node:20
  needs:
    - lint_js
  before_script:
    - cd bot
    - npm ci || npm install 
  script:
    - echo "Running bot tests..."
    - npm test || echo "No JS tests yet"

unit_tests_ml:
  stage: test
  needs:
      - lint_python
  script:
    - pip install pytest
    - cd ml
    - echo "Running ml tests..."
    - pytest -v  || echo "No smoke tests yet"

smoke_tests:
  stage: smoke
  needs:
    - unit_tests_backend
    - unit_tests_bot
    - unit_tests_ml
  script:
    - echo "No smoke tests yet"