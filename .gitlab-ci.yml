stages:
  - prepare
  - lint
  - test
  - smoke

variables:
  NPM_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/npm"
  NODE_VERSION: "20"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11.9"

.node_alpine: &node_alpine
  image: node:${NODE_VERSION}-alpine

.python_alpine: &python_alpine
  image: python:${PYTHON_VERSION}-alpine

cache:
    paths:
      - .cache/
      - node_module/

default:
  before_script:
      - |
        check_noempty() {
          local dir = "$1"
          echo "Checking for empty directories in $dir"
          if find "$dir" -type f ! -name ".gitkeep" ! -path "*/.*" | grep -q .; then
            echo "$dir has files"
            return 0
          else
            echo "$dir is empty (only .gitkeep)"
            return 1
          fi
        }

python_prepare_deps:
  <<: *python_alpine
  stage: prepare
  before_script:
    - echo "Installing uv..."
    - python -m pip install --upgrade pip
    - pip install uv --cahce-dir ${PIP_CACHE_DIR}
  script:
    - echo "Preparing uv dependencies"
    - cd backend
    - uv sync
    - echo "uv deps ready"

js_prepare_deps:
  <<: *node_alpine
  stage: prepare
  script:
    - echo "Preparing Node.js dependencies"
    - cd bot
    - npm install --cache ${NPM_CACHE_DIR} --legacy-peer-deps || npm ci --legacy-peer-deps
    - echo "Node.js deps ready"

python_lint:
  <<: *python_alpine
  stage: lint
  needs:
    - python_prepare_deps
  before_script:
    - cd backend
    - source .venv/bin/activate
    - uv add ruff
  script:
    - uvx ruff check

js_lint:
    <<: *node_alpine
    stage: lint
    script:
        - echo "Running ESLint..."
        - npx eslint || echo "No ESLint config yet"

backend_unit_tests:
  <<: *python_alpine
  stage: test
  needs:
    - python_lint
  before_script:
    - cd backend
  script:
    - echo "Running backend tests..."
    - check_noempty tests && uvx pytest -v

bot_unit_tests:
    <<: *node_alpine
    stage: test
    needs:
      - js_lint
    script:
        - echo "Running bot tests..."
        - check_noempty tests && npm test

smoke_test:
  stage: smoke
  needs:
    - backend_unit_tests
    - bot_unit_tests
  script:
    - echo "No smoke test yet"