stages:
  - prepare
  - lint
  - test
  - smoke

variables:
  NPM_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/npm"
  NODE_VERSION: "20"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11.9"

.node_alpine: &node_alpine
  image: node:${NODE_VERSION}-alpine

.python_alpine: &python_alpine
  image: python:${PYTHON_VERSION}-alpine

cache:
    paths:
      - .cache/
      - backend/.venv/
      - node_module/

python_prepare_deps:
  <<: *python_alpine
  stage: prepare
  before_script:
    - echo "Installing uv..."
    - python -m pip install --upgrade pip
    - pip install uv
  script:
    - echo "Preparing uv dependencies"
    - cd backend
    - uv sync
    - echo "uv deps ready"

js_prepare_deps:
  <<: *node_alpine
  stage: prepare
  script:
    - echo "Preparing Node.js dependencies"
    - cd bot
    - npm install --cache ${NPM_CACHE_DIR} --legacy-peer-deps || npm ci --legacy-peer-deps
    - echo "Node.js deps ready"

python_lint:
  <<: *python_alpine
  stage: lint
  needs:
    - python_prepare_deps
  before_script:
    - cd backend
    - uv add ruff
  script:
    - uv tool run ruff check

js_lint:
    <<: *node_alpine
    stage: lint
    needs:
      - js_prepare_deps
    script:
        - echo "Running ESLint..."
        - npx eslint || echo "No ESLint config yet"

backend_unit_tests:
  <<: *python_alpine
  stage: test
  needs:
    - python_lint
  before_script:
    - cd backend
  script:
    - echo "Running backend tests..."
    - uv tool run pytest -v

bot_unit_tests:
    <<: *node_alpine
    stage: test
    needs:
      - js_lint
    script:
        - echo "Running bot tests..."
        - npm test

smoke_test:
  stage: smoke
  needs:
    - backend_unit_tests
    - bot_unit_tests
  script:
    - echo "No smoke test yet"