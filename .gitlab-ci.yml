stages:
  - lint
  - test
  - smoke

variables:
  NPM_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/npm"
  NODE_MODULE_DIR: "${CI_PROJECT_DIR}/bot/node_module"
  NODE_VERSION: "20"

.node_alpine: &node_alpine
  image: node:${NODE_VERSION}-alpine

cache:
    paths:
      - .cache/
      - ${NODE_MODULE_DIR}

default:
  <<: *node_alpine
  before_script:
      - echo "Preparing Node.js dependencies"
      - cd bot
      - npm ci
      - echo "Node.js deps ready"
      - |
        check_noempty() {
          local dir = "$1"
          echo "Checking for empty directories in $dir"
          if find "$dir" -type f ! -name ".gitkeep" ! -path "*/.*" | grep -q .; then
            echo "$dir has files"
            return 0
          else
            echo "$dir is empty (only .gitkeep)"
            return 1
          fi
        }

js_lint:
    stage: lint
    script:
        - echo "Running ESLint..."
        - npx eslint . || echo "No ESLint config yet"

bot_tests:
    stage: test
    needs:
      - js_lint
    script:
        - echo "Running bot tests..."
        - ckeck_noempty src
        - check_noempty tests
        - npm test

smoke_test:
  stage: smoke
  needs:
    - bot_tests
  script:
    - echo "No smoke test yet"