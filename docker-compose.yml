services:
  services:
  redis:
    image: redis:8.4.0-alpine
    hostname: redis
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass yourpassword
    networks:
      - redis_network
    volumes:
      - redis_data:/data
      
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbit
    hostname: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rabbitmq_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 10
    
    volumes:
      - shared_data:/shared

  api:
    build: ./backend
    container_name: backend
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - rabbitmq_network
      - redis_network
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/shared

volumes:
  shared_data:
  redis_data:
    driver: local

networks:
  rabbitmq_network: