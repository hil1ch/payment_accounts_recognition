stages:
  - lint
  - test
  - smoke

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

cache:
  paths:
    - .cache/pip
    - node_modules/

default:
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m pip install --upgrade pip
    - pip install pytest ruff 
    - |
      check_nonempty() {
        local dir="$1"
        echo "Checking folder: $dir"
        if find "$dir" -type f ! -name ".gitkeep" ! -path "*/.*" | grep -q .; then
          echo "$dir has real files"
          return 0
        else
          echo "$dir is empty (only .gitkeep)"
          return 1
        fi
      }

lint_python:
  stage: lint
  script:
    - ruff check .
  allow_failure: false

lint_js:
  stage: lint
  image: node:22
  before_script:
    - cd bot
    - npm ci  || npm install
  script:
    - echo "Running ESLint..."
    - npx eslint . || echo "No ESLint config yet"
  allow_failure: true #while tests empty

unit_tests_backend:
  stage: test
  needs: 
    - lint_python
  script:
    - cd backend
    - pip install -r requirements.txt
    - echo "Running backend tests..."
    - check_nonempty backend/tests && pytest -v

unit_tests_bot:
  stage: test
  image: node:20
  needs:
    - lint_js
  before_script:
    - cd bot
    - npm ci || npm install 
  script:
    - echo "Running bot tests..."
    - check_nonempty bot/tests && npm test

unit_tests_ml:
  stage: test
  needs:
      - lint_python
  script:
    - cd ml
    - pip install -r requirements.txt
    - echo "Running ml tests..."
    - check_nonempty ml/tests && pytest -v

smoke_tests:
  stage: smoke
  needs:
    - unit_tests_backend
    - unit_tests_bot
    - unit_tests_ml
  script:
    - echo "No smoke tests yet"