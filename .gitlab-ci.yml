stages:
  - lint
  - test
  - smoke

variables:
  NPM_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/npm"
  NODE_VERSION: "20"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11.9"

.node_alpine: &node_alpine
  image: node:${NODE_VERSION}-alpine

.python_alpine: &python_alpine
  image: python:${PYTHON_VERSION}-alpine

cache:
    paths:
      - .cache/
      - node_module/

default:
  <<: *python_alpine
  before_script:
      - python -m pip install --upgrade pip
      - pip install uv --cache-dir ${PIP_CACHE_DIR}
      - cd backend && uv sync
      - uv venv
      - cd ..
      - |
        check_noempty() {
          local dir = "$1"
          echo "Checking for empty directories in $dir"
          if find "$dir" -type f ! -name ".gitkeep" ! -path "*/.*" | grep -q .; then
            echo "$dir has files"
            return 0
          else
            echo "$dir is empty (only .gitkeep)"
            return 1
          fi
        }

python_lint:
  stage: lint
  before_script:
    - cd backend
    - source .venv/bin/activate
    - uv add ruff
  script:
    - uvx ruff check .

js_lint:
    <<: *node_alpine
    stage: lint
    before_script:
      - cd bot
      - npm install --legacy-peer-deps || npm ci --force
    script:
        - echo "Running ESLint..."
        - npx eslint . || echo "No ESLint config yet"

backend_unit_tests:
  stage: test
  needs:
    - python_lint
  before_script:
    - cd backend
  script:
    - echo "Running backend tests..."
    - check_noempty tests && uvx pytest -v

bot_unit_tests:
    <<: *node_alpine
    stage: test
    needs:
      - js_lint
    before_script:
      - cd bot
      - npm install --legacy-peer-deps || npm ci --force
    script:
        - echo "Running bot tests..."
        - check_noempty tests && npm test

smoke_test:
  stage: smoke
  needs:
    - backend_unit_tests
    - bot_unit_tests
  script:
    - echo "No smoke test yet"